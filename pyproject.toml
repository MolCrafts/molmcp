[project]
name = "molcrafts-molmcp"
version = "0.7.0"
description = "MolCrafts MCP: knowledge core plus FastMCP-mounted provider planes"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "BSD-3-Clause"}

authors = [
    { name = "Roy Kid", email = "lijichen365@gmail.com" }
]

keywords = [
    "mcp",
    "model-context-protocol",
    "molcrafts",
    "molecular-simulation",
    "introspection",
    "llm-tools",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastmcp>=4.0.0b5,<5",
    "jsonschema>=4.25,<5",
    "packaging>=25,<27",
    # <0.26: tree-sitter 0.26.0 segfaults walking large generated JS bundles
    # (native regression; reproduced on Atomiverse docs assets, 2026-07-20).
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-rust>=0.24,<0.25",
    "tree-sitter-typescript>=0.23,<0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6",
    "tox>=4.23",
]
docs = [
    "zensical>=0.0.53",
    "molcrafts-zensical-theme>=0.2.5",
]

[project.scripts]
molmcp = "molmcp.cli:main"

[project.entry-points."molmcp.providers"]
molexp = "molmcp.providers.molexp:MolexpProvider"
molq = "molmcp.providers.molq:MolqProvider"
molvis = "molmcp.providers.molvis:MolvisProvider"

[project.urls]
Homepage = "https://github.com/MolCrafts/molmcp"
Documentation = "https://docs.molcrafts.org/molmcp/"
Repository = "https://github.com/MolCrafts/molmcp.git"
Issues = "https://github.com/MolCrafts/molmcp/issues"

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"molmcp.discovery.store" = ["*.sql"]
"molmcp.skill" = ["SKILL.md", "*/SKILL.md"]

[tool.pytest.ini_options]
# Three roots, one flat import namespace: a future scripts/ module must not
# be named after a tests/ top-level package, or one silently shadows the other.
pythonpath = ["src", "tests", "scripts"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that exercise the full server",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# PLW1514 (a preview rule; explicit-preview-rules keeps every other preview
# rule off): text-mode file I/O names its encoding. Unnamed, Python decodes
# with the locale -- cp1252 on Windows -- so a read that passes every Linux
# hook fails only on CI's Windows leg.
select = ["E", "F", "I", "PLW1514"]
preview = true
explicit-preview-rules = true

[tool.ruff.lint.per-file-ignores]
# PEP 562 façades: every name in __all__ resolves through __getattr__, which
# preview F822 cannot see. tests/test_init.py pins __all__ against the lazy map.
"src/molmcp/__init__.py" = ["F822"]
"src/molmcp/provider_worker/__init__.py" = ["F822"]

# Isolated gates — prek + CI: uv run --extra dev tox -e lint|py
[tool.tox]
requires = ["tox>=4.23"]
env_list = ["lint", "py"]

[tool.tox.env.lint]
description = "CI lint"
skip_install = true
base_python = ["python3.12"]
deps = [
  "ruff>=0.6",
  "pytest>=7.0.0",
  "pytest-asyncio>=0.23.0",
]
commands = [
  ["ruff", "check", "src", "tests"],
  ["ruff", "format", "--check", "src", "tests"],
]

[tool.tox.env.py]
description = "CI test (non-editable package when package=wheel)"
base_python = ["python3.12"]
pass_env = [
  "HOME",
  "PATH",
  "SSH_AUTH_SOCK",
  "TERM",
  "VIRTUAL_ENV",
  "UV_*",
]
package = "wheel"
extras = ["dev"]
commands_pre = [
  [
    "{envpython}",
    "-c",
    "import pathlib, site; sps=site.getsitepackages(); print('site-packages', sps)",
  ],
]
commands = [
  ["{envpython}", "-m", "pytest", "-v"],
]

# FastMCP 4 only (MCP 2026-07-28). Never 3.x — it speaks the protocol this
# repo was rebuilt off.
#
# The lower bound is a pre-release on purpose. A bare `fastmcp` resolves to
# the newest *stable* (3.x); and `>=4.0.0` resolves to nothing until 4.0.0
# final exists. uv needs `--prerelease=allow` for the same reason.
# See docs/get-started/installation.md.
#
# Narrow this to `>=4.0.0,<5` the day 4.0.0 ships.
[tool.uv]
constraint-dependencies = [
    "fastmcp-slim>=4.0.0b5,<5",
]
