[project]
name = "molcrafts-molmcp"
version = "0.5.3"
description = "Multi-plane on-demand MCP for MolCrafts: one product domain per connection"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "BSD-3-Clause"}

authors = [
    { name = "Roy Kid", email = "lijichen365@gmail.com" }
]

keywords = [
    "mcp",
    "model-context-protocol",
    "molcrafts",
    "molecular-simulation",
    "introspection",
    "llm-tools",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastmcp>=4.0.0b1,<5",
    "jsonschema>=4.25,<5",
    "packaging>=25,<27",
    # <0.26: tree-sitter 0.26.0 segfaults walking large generated JS bundles
    # (native regression; reproduced on Atomiverse docs assets, 2026-07-20).
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-rust>=0.24,<0.25",
    "tree-sitter-typescript>=0.23,<0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6",
    "tox>=4.23",
]
docs = [
    "zensical>=0.0.53",
    "molcrafts-zensical-theme>=0.2.5",
]

[project.scripts]
molmcp = "molmcp.cli:main"

[project.entry-points."molmcp.providers"]
molexp = "molmcp.providers.molexp:MolexpProvider"
molq = "molmcp.providers.molq:MolqProvider"
molvis = "molmcp.providers.molvis:MolvisProvider"

[project.urls]
Homepage = "https://github.com/MolCrafts/molmcp"
Documentation = "https://docs.molcrafts.org/molmcp/"
Repository = "https://github.com/MolCrafts/molmcp.git"
Issues = "https://github.com/MolCrafts/molmcp/issues"

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"molmcp.discovery.store" = ["*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that exercise the full server",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

# Isolated gates — prek + CI: uv run --extra dev tox -e lint|py
[tool.tox]
requires = ["tox>=4.23"]
env_list = ["lint", "py"]

[tool.tox.env.lint]
description = "CI lint"
skip_install = true
base_python = ["python3.12"]
deps = [
  "ruff>=0.6",
  "pytest>=7.0.0",
  "pytest-asyncio>=0.23.0",
]
commands = [
  ["ruff", "check", "src", "tests"],
  ["ruff", "format", "--check", "src", "tests"],
]

[tool.tox.env.py]
description = "CI test (non-editable package when package=wheel)"
base_python = ["python3.12"]
pass_env = [
  "HOME",
  "PATH",
  "SSH_AUTH_SOCK",
  "TERM",
  "VIRTUAL_ENV",
  "UV_*",
]
package = "wheel"
extras = ["dev"]
commands_pre = [
  [
    "{envpython}",
    "-c",
    "import pathlib, site; sps=site.getsitepackages(); print('site-packages', sps)",
  ],
]
commands = [
  ["{envpython}", "-m", "pytest", "-v"],
]

# FastMCP 4 only (MCP 2026-07-28). Never 3.x — it speaks the protocol this
# repo was rebuilt off.
#
# The lower bound is a pre-release on purpose. A bare `fastmcp` resolves to
# the newest *stable*, which is 3.4.6; and `>=4.0.0` resolves to nothing,
# because PyPI's 4.x line is a1/a2/b1/b2 with no final yet.
#
# uv will not install this from an index without `--prerelease=allow`: it
# does not enable pre-releases for a transitive dependency. Measured: an
# exact `==4.0.0b2` pin is refused for the same reason, so pinning buys
# nothing and only freezes us a version behind. pip resolves either form.
# See docs/get-started/installation.md.
#
# Narrow this to `>=4.0.0,<5` the day 4.0.0 ships — a stable lower bound
# needs no pre-release opt-in and the uv problem goes with it.
[tool.uv]
constraint-dependencies = [
    "fastmcp-slim>=4.0.0b1,<5",
]
