[project]
name = "molcrafts-molmcp"
version = "0.3.0"
description = "Local-first registry, code intelligence, and MCP context plane for MolCrafts"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "BSD-3-Clause"}

authors = [
    { name = "Roy Kid", email = "lijichen365@gmail.com" }
]

keywords = [
    "mcp",
    "model-context-protocol",
    "molcrafts",
    "molecular-simulation",
    "introspection",
    "llm-tools",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastmcp>=3.4,<4",
    "jsonschema>=4.25,<5",
    "packaging>=25,<27",
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-rust>=0.24,<0.25",
    "tree-sitter-typescript>=0.23,<0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6",
]
docs = [
    "zensical>=0.0.45",
    "molcrafts-zensical-theme>=0.1.0",
]

[project.scripts]
molmcp = "molmcp.cli:main"

[project.entry-points."molmcp.providers"]
molexp = "molmcp.providers.molexp:MolexpProvider"

[project.urls]
Homepage = "https://github.com/MolCrafts/molmcp"
Documentation = "https://molcrafts.github.io/molmcp/"
Repository = "https://github.com/MolCrafts/molmcp.git"
Issues = "https://github.com/MolCrafts/molmcp/issues"
Changelog = "https://github.com/MolCrafts/molmcp/blob/master/CHANGELOG.md"

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"molmcp.discovery.store" = ["*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that exercise the full server",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
