[project]
site_name = "molmcp"
site_description = "The MCP foundation for the MolCrafts ecosystem"
site_author = "Roy Kid"
site_url = "https://molcrafts.github.io/molmcp/"
copyright = """
Copyright &copy; 2026 MolCrafts contributors
"""

repo_name = "MolCrafts/molmcp"
repo_url = "https://github.com/MolCrafts/molmcp"

nav = [
    { "Home" = "index.md" },
    { "Tutorials" = [
        { "Installation" = "get-started/installation.md" },
        { "Quickstart" = "get-started/quickstart.md" },
        { "Deploy" = "get-started/deploy.md" },
        { "Architecture" = "concepts/architecture.md" },
        { "Discovery" = "concepts/discovery.md" },
        { "Provider design" = "concepts/provider-design.md" },
        { "Providers" = "concepts/providers.md" },
        { "Middleware" = "concepts/middleware.md" },
        { "Expose a package" = "guides/expose-a-package.md" },
        { "Write a Provider" = "guides/write-a-provider.md" },
        { "Security" = "guides/security.md" },
    ] },
    { "Reference" = [
        { "CLI" = "reference/cli.md" },
        { "API" = "reference/api.md" },
    ] },
]

# Shared MolCrafts theme (github.com/MolCrafts/molcrafts-zensical-theme): brand
# palette, light/dark schemes, navigation features, and the home-page
# hero/manual-home layout that docs/index.md uses. The theme already supplies
# the features/palette/fonts — do not re-list them here. Install the theme to
# build (see the `docs` optional-dependency group in pyproject.toml). Markdown
# extensions below are orthogonal to the theme and stay as the site declares them.
[project.theme]
name = "molcrafts"
language = "en"

# molmcp accent (indigo) for links, hovers, and hero eyebrows.
[project.extra.molcrafts]
product = "molmcp"
accent = "#4f46e5"                        # primary (主) — molmcp signature colour
accent_soft = "rgba(79, 70, 229, 0.14)"   # secondary (副) — soft fill behind it

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/MolCrafts/molmcp"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/molcrafts-molmcp/"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
