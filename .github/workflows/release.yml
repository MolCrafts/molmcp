name: release

# A v* tag on MolCrafts/molmcp: guard (the tag is pyproject's version) ->
# lint + the full test tier -> build -> PyPI (trusted publishing). A dispatch
# is the dry run, fork or upstream: everything but the upload.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One group per file, workflow, event and ref; a release is never cancelled.
# The canonical block: actions/check-workflows.
concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Where this run happens, decided once: MolCrafts/molcrafts-ci/actions/ci-context.
  context:
    name: release / context
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.context.outputs.tier }}
      upstream: ${{ steps.context.outputs.upstream }}
      integration: ${{ steps.context.outputs.integration }}
      skip-pr: ${{ steps.context.outputs.skip-pr }}
      publish: ${{ steps.context.outputs.publish }}
    steps:
      - id: context
        uses: MolCrafts/molcrafts-ci/actions/ci-context@master

  guard:
    name: release / guard
    needs: context
    if: github.event_name == 'workflow_dispatch' || needs.context.outputs.upstream == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The tag is the package version
        if: github.event_name == 'push'
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::tag $GITHUB_REF_NAME is not v$version"; exit 1; }

  lint:
    needs: guard
    uses: ./.github/workflows/lint.yml

  test:
    needs: guard
    uses: ./.github/workflows/test.yml

  build:
    name: release / build
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@master
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    name: release / pypi
    needs: [context, build]
    if: needs.context.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
