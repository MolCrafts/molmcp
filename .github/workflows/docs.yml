name: docs

# The site as Cloudflare Pages builds it, --strict: any warning fails.
# Cloudflare Pages deploys it from MolCrafts itself, so no job here deploys.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["dev","master","main"]'), github.base_ref || github.ref_name) }}

jobs:
  build:
    name: docs / build
    # A pull request from a branch of this same repository was already run by its push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python
      - run: uv sync --extra docs
      - run: uv run zensical build --strict
